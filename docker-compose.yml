services:
  nawi-web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-nawi_prod_secret_change_me}
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
